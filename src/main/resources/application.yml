server:
  port: ${PORT:8085}
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:file_management}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:Hoanhao@1512}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:500MB}
      max-request-size: ${MAX_REQUEST_SIZE:500MB}
app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8085}
  web-base-url: ${WEB_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
  security:
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${REFRESH_EXPIRATION_MS:2592000000}
  trash:
    retention-days: ${TRASH_RETENTION_DAYS:30}
    cleanup-cron: "${TRASH_CLEANUP_CRON:0 15 2 * * *}"
  storage:
    health-cron: "${STORAGE_HEALTH_CRON:0 */10 * * * *}"
