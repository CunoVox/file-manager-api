services:
  mysql:
    image: mysql:8.4
    container_name: file-manager-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: file_manager
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - file-manager-mysql:/var/lib/mysql
volumes:
  file-manager-mysql: